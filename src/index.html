<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>G2 Buzz | Quizzes de personalidade, trivia e isto ou aquilo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="G2 Buzz reúne quizzes autorais em português: personalidade, trivia com explicação e isto ou aquilo sobre games, filmes, tecnologia, Brasília e curiosidades.">
  <meta name="author" content="Gustavo Martins Gripaldi">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f1e8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Reveal bootstrap before first paint. Content shows anyway if JS never boots. -->
  <script>
    (function () {
      var c = document.documentElement.classList;
      c.add('js');
      setTimeout(function () { if (!c.contains('reveal-ready')) c.add('reveal-all'); }, 3000);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
